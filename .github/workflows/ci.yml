name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  database:
    name: Content + database (migrations, RLS, game RPCs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate content and check the generated SQL is up to date
        run: |
          npm ci --prefix packages/content
          npm run check --prefix packages/content
      - name: Run database tests on PGlite
        run: |
          npm ci --prefix tools/db-tests
          npm test --prefix tools/db-tests

  edge-functions:
    name: Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/*/index.ts
      - run: deno test supabase/functions

  mobile:
    name: Flutter app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.3
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test

  e2e:
    name: End-to-end (web build + demo API)
    runs-on: ubuntu-latest
    needs: [database, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.3
          cache: true
      - name: Start the demo API (real migrations and RPCs on PGlite)
        run: |
          npm ci --prefix tools/db-tests
          (npm run dev --prefix tools/db-tests > dev-api.log 2>&1 &)
      - name: Build and serve the web app (profile build keeps readable stack traces)
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter build web --profile --dart-define=SUPABASE_URL=http://127.0.0.1:54321 --dart-define=SUPABASE_PUBLISHABLE_KEY=ci
          (npx --yes http-server build/web -p 51973 -a 127.0.0.1 -s > ../../web.log 2>&1 &)
      - name: Wait for both servers
        run: |
          for i in $(seq 1 60); do
            curl -sf -X OPTIONS http://127.0.0.1:54321/ >/dev/null && curl -sf http://127.0.0.1:51973/ >/dev/null && exit 0
            sleep 2
          done
          cat dev-api.log web.log; exit 1
      - name: Run the walkthrough
        run: |
          npm ci --prefix tools/e2e
          npx --prefix tools/e2e playwright install --with-deps chromium
          npm test --prefix tools/e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tools/e2e/artifacts/
