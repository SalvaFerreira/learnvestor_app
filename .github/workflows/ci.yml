name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  database:
    name: Content + database (migrations, RLS, game RPCs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate content and check the generated SQL is up to date
        run: |
          npm ci --prefix packages/content
          npm run check --prefix packages/content
      - name: Run database tests on PGlite
        run: |
          npm ci --prefix tools/db-tests
          npm test --prefix tools/db-tests

  mobile:
    name: Flutter app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.3
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test

  e2e:
    name: End-to-end (browser demo)
    runs-on: ubuntu-latest
    needs: [database, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.3
          cache: true
      - name: Build the browser demo (Flutter web + demo API on PGlite, no server)
        run: |
          npm ci --prefix tools/db-tests
          npm ci --prefix tools/web-demo
          npm run build --prefix tools/web-demo
      - name: Serve the demo
        run: |
          (npx --yes http-server tools/web-demo/dist -p 51973 -a 127.0.0.1 -c-1 > web.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:51973/ >/dev/null && exit 0; sleep 2; done
          cat web.log; exit 1
      - name: Run the walkthrough
        run: |
          npm ci --prefix tools/e2e
          npx --prefix tools/e2e playwright install --with-deps chromium
          npm test --prefix tools/e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tools/e2e/artifacts/
