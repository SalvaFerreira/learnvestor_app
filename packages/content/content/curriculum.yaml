# LearnVestor curriculum: the single source of truth for tracks, units, lesson order
# and regions. Every lesson is free. Each lesson listed here is "planned" until a file exists in
# content/lessons/<track>/<lesson-id>.json ("draft") and "reviewed" once a person has checked it.
# The demo shows drafts and reviewed lessons.
#
#   goals        what the learner must be able to do after the lesson (input for drafting)
#   facts        facts the lesson must teach correctly; time-sensitive ones get valid_until
#   sources      official references a reviewer checks the facts against
#   regions      ISO countries where the lesson is shown (omit = everywhere)
#   valid_until  date after which the lesson must be re-reviewed (tax rules, rates...)
#
# Launch market: Portugal (PT-PT first, EN second). Keep the tone educational: explain
# concepts and trade-offs, never recommend specific products, brokers or securities.

sources:
  bdp: https://clientebancario.bportugal.pt
  fgd: https://www.fgd.pt
  financas: https://info.portaldasfinancas.gov.pt
  segsocial: https://www.seg-social.pt
  igcp: https://www.igcp.pt
  cmvm: https://www.cmvm.pt
  todoscontam: https://www.todoscontam.pt
  ecb: https://www.ecb.europa.eu
  spiva: https://www.spglobal.com/spdji/en/research-insights/spiva/

tracks:
  - id: banks
    position: 1
    icon: account_balance
    color: "#3B82F6"
    title: { en: "Everyday Money", pt: "Dinheiro no Dia a Dia" }
    description:
      en: Banks, budgets, payments and credit without surprises
      pt: Bancos, orçamento, pagamentos e crédito sem surpresas
    units:
      - id: money-basics
        title: { en: "Money Basics", pt: "Bases do Dinheiro" }
        description: { en: "Build a safe foundation before investing", pt: "Constrói uma base segura antes de investir" }
        lessons:
          - id: what-is-a-bank
            title: { en: "How Banks Work", pt: "Como Funcionam os Bancos" }
            goals: ["Explicar como um banco ganha dinheiro", "Distinguir conta à ordem de conta poupança"]
            facts: ["Na UE os depósitos estão garantidos até 100 000 € por depositante e por banco"]
            sources: [fgd, bdp]
          - id: emergency-fund
            title: { en: "Your Emergency Fund", pt: "O Teu Fundo de Emergência" }
            goals: ["Calcular um fundo de emergência de 3 a 6 meses de despesas essenciais", "Saber onde o guardar"]
            sources: [todoscontam]
          - id: compound-interest
            title: { en: "The Magic of Compound Interest", pt: "A Magia dos Juros Compostos" }
            goals: ["Distinguir juro simples de composto", "Usar a regra dos 72"]
            sources: [todoscontam]
          - id: inflation
            title: { en: "Inflation", pt: "Inflação" }
            goals: ["Explicar porque é que o dinheiro parado perde poder de compra", "Ler a taxa de inflação"]
            facts: ["O BCE tem um objetivo de inflação de 2% a médio prazo"]
            sources: [ecb, bdp]
          - id: real-interest-rate
            title: { en: "Real vs Nominal Returns", pt: "Rentabilidade Real vs Nominal" }
            goals: ["Calcular de forma aproximada a rentabilidade real (nominal menos inflação)"]
            sources: [todoscontam]

      - id: budgeting
        title: { en: "Budgeting", pt: "Orçamento" }
        description: { en: "Know where your money goes", pt: "Sabe para onde vai o teu dinheiro" }
        lessons:
          - id: budget-50-30-20
            title: { en: "The 50/30/20 Rule", pt: "A Regra 50/30/20" }
            goals: ["Dividir o rendimento líquido em necessidades, desejos e poupança"]
            sources: [todoscontam]
          - id: tracking-expenses
            title: { en: "Tracking Expenses", pt: "Registar Despesas" }
            goals: ["Distinguir despesas fixas, variáveis e ocasionais", "Criar o hábito de registar"]
            sources: [todoscontam]
          - id: needs-vs-wants
            title: { en: "Needs vs Wants", pt: "Necessidades vs Desejos" }
            goals: ["Classificar despesas", "Reconhecer compras por impulso"]
            sources: [todoscontam]
          - id: saving-goals
            title: { en: "Saving Goals", pt: "Objetivos de Poupança" }
            goals: ["Definir objetivos com valor e prazo", "Calcular quanto poupar por mês"]
            sources: [todoscontam]
          - id: pay-yourself-first
            title: { en: "Pay Yourself First", pt: "Paga-te Primeiro a Ti" }
            goals: ["Automatizar a poupança no dia do salário"]
            sources: [todoscontam]

      - id: payments-fraud
        title: { en: "Payments & Fraud", pt: "Pagamentos e Fraudes" }
        description: { en: "Pay safely and spot scams", pt: "Paga em segurança e identifica burlas" }
        lessons:
          - id: debit-vs-credit-cards
            title: { en: "Debit vs Credit Cards", pt: "Cartão de Débito vs Crédito" }
            goals: ["Explicar a diferença entre débito e crédito", "Perceber o custo de pagar só o mínimo"]
            sources: [bdp]
          - id: instant-payments
            title: { en: "Instant Payments", pt: "Pagamentos Imediatos" }
            goals: ["Explicar transferências imediatas e MB WAY", "Saber que uma transferência enviada é difícil de reverter"]
            regions: [PT]
            sources: [bdp]
          - id: phishing
            title: { en: "Phishing and Fake Messages", pt: "Phishing e Mensagens Falsas" }
            goals: ["Reconhecer SMS e emails falsos do \"banco\"", "Nunca partilhar códigos de autenticação"]
            facts: ["Os bancos nunca pedem códigos de autenticação por SMS, email ou telefone"]
            sources: [bdp]
          - id: protect-your-accounts
            title: { en: "Protect Your Accounts", pt: "Protege as Tuas Contas" }
            goals: ["Usar autenticação forte e palavras-passe únicas", "Saber o que fazer após uma fraude"]
            sources: [bdp]

      - id: credit
        title: { en: "Credit", pt: "Crédito" }
        description: { en: "Borrow only when it makes sense", pt: "Pede emprestado só quando faz sentido" }
        lessons:
          - id: tan-vs-taeg
            title: { en: "Nominal vs Annual Percentage Rate", pt: "TAN vs TAEG" }
            goals: ["Explicar porque a TAEG inclui custos além dos juros", "Comparar propostas pela TAEG"]
            sources: [bdp]
          - id: consumer-credit
            title: { en: "Consumer Credit", pt: "Crédito ao Consumo" }
            goals: ["Avaliar o custo total de um crédito pessoal ou automóvel"]
            sources: [bdp]
          - id: credit-card-debt
            title: { en: "Credit Card Debt", pt: "Dívida de Cartão de Crédito" }
            goals: ["Perceber como os juros de cartão se acumulam", "Priorizar o pagamento de dívidas caras"]
            sources: [bdp]
          - id: mortgage-basics
            title: { en: "Mortgage Basics", pt: "Crédito Habitação: o Básico" }
            goals: ["Explicar Euribor, spread e taxa fixa vs variável", "Perceber o esforço da prestação"]
            regions: [PT]
            sources: [bdp]
          - id: credit-history
            title: { en: "Your Credit History", pt: "O Teu Histórico de Crédito" }
            goals: ["Explicar o que é a Central de Responsabilidades de Crédito e como a consultar"]
            regions: [PT]
            sources: [bdp]
          - id: paying-off-debt
            title: { en: "Paying Off Debt", pt: "Pagar Dívidas" }
            goals: ["Comparar os métodos bola de neve e avalanche"]
            sources: [todoscontam]

      - id: big-decisions
        title: { en: "Big Decisions", pt: "Grandes Decisões" }
        description: { en: "Housing, cars and insurance", pt: "Casa, carro e seguros" }
        lessons:
          - id: rent-vs-buy
            title: { en: "Rent or Buy?", pt: "Arrendar ou Comprar?" }
            goals: ["Listar os custos de comprar casa além da prestação", "Perceber que a decisão depende do horizonte"]
            regions: [PT]
            sources: [bdp]
          - id: car-cash-vs-loan
            title: { en: "Buying a Car", pt: "Comprar Carro" }
            goals: ["Comparar pagar a pronto, crédito e leasing pelo custo total"]
            sources: [bdp]
          - id: insurance-basics
            title: { en: "Insurance Basics", pt: "Seguros: o Básico" }
            goals: ["Explicar prémio, franquia e capital seguro", "Distinguir seguros obrigatórios de opcionais"]
            sources: [todoscontam]

      - id: income
        title: { en: "Earning Money", pt: "Ganhar Dinheiro" }
        description: { en: "First job, freelancing and extra income", pt: "Primeiro emprego, trabalho independente e rendimentos extra" }
        lessons:
          - id: first-job
            title: { en: "Your First Job", pt: "O Teu Primeiro Emprego" }
            goals: ["Perceber contrato, período experimental e o que verificar no primeiro salário"]
            regions: [PT]
            sources: [segsocial]
          - id: freelancing
            title: { en: "Working Independently", pt: "Trabalhar a Recibos Verdes" }
            goals: ["Explicar o regime de trabalhador independente, retenções e contribuições de forma geral"]
            regions: [PT]
            valid_until: 2026-12-31
            sources: [financas, segsocial]
          - id: lifestyle-inflation
            title: { en: "Lifestyle Inflation", pt: "Inflação do Estilo de Vida" }
            goals: ["Reconhecer quando os gastos sobem com o rendimento", "Poupar parte de cada aumento"]
            sources: [todoscontam]

  - id: taxes
    position: 2
    icon: receipt_long
    color: "#22C55E"
