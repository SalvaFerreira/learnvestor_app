          - id: replacement-rate
            title: { en: "Replacement Rate", pt: "Taxa de Substituição" }
            goals: ["Explicar porque a pensão costuma ser inferior ao último salário"]
            sources: [segsocial]
          - id: ppr-basics
            title: { en: "Retirement Savings Plans", pt: "PPR: o Básico" }
            goals: ["Explicar o que é um PPR, as regras de resgate e o benefício fiscal"]
            facts: ["A dedução à coleta é de 20% do valor aplicado, com limites que dependem da idade"]
            valid_until: 2026-12-31
            sources: [financas, cmvm]
          - id: start-early
            title: { en: "Start Early", pt: "Começar Cedo" }
            goals: ["Mostrar com números o efeito de começar 10 anos mais cedo"]
            sources: [todoscontam]

      - id: other-taxes
        title: { en: "Other Taxes", pt: "Outros Impostos" }
        description: { en: "VAT and property taxes", pt: "IVA e impostos sobre imóveis" }
        lessons:
          - id: vat
            title: { en: "VAT", pt: "IVA" }
            goals: ["Explicar o IVA e as taxas normal, intermédia e reduzida"]
            valid_until: 2026-12-31
            sources: [financas]
          - id: property-taxes
            title: { en: "Property Taxes", pt: "IMT, IMI e Imposto do Selo" }
            goals: ["Saber que impostos se pagam ao comprar e ao ter casa"]
            valid_until: 2026-12-31
            sources: [financas]

