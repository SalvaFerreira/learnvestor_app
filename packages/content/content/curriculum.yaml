            title: { en: "Treasury Certificates", pt: "Certificados do Tesouro" }
            goals: ["Comparar com os Certificados de Aforro em prazo e remuneração"]
            valid_until: 2026-12-31
            sources: [igcp]
          - id: deposits-vs-certificates
            title: { en: "Deposits vs Certificates", pt: "Depósitos vs Certificados" }
            goals: ["Comparar liquidez, garantia e rentabilidade"]
            valid_until: 2026-12-31
            sources: [igcp, fgd]

      - id: retirement
        title: { en: "Retirement", pt: "Reforma" }
        description: { en: "Plan the long term", pt: "Planear o longo prazo" }
        lessons:
          - id: how-pensions-work
            title: { en: "How Public Pensions Work", pt: "Como Funcionam as Pensões" }
