            goals: ["Saber que despesas podem ser deduzidas", "Pedir fatura com NIF"]
            valid_until: 2026-12-31
            sources: [financas]
          - id: irs-jovem
            title: { en: "IRS Jovem", pt: "IRS Jovem" }
            goals: ["Explicar o objetivo do regime e onde confirmar as regras em vigor"]
            valid_until: 2026-12-31
            sources: [financas]
          - id: irs-filing
